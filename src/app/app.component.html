<!-- Cinematic intro loader -->
<app-loader (loaded)="onLoaded()"></app-loader>

<!-- 3D WebGL Background Scene Canvas -->
<div class="canvas-container">
  <canvas #threeCanvas class="w-full h-full block"></canvas>
</div>

<!-- Ambient mist & lighting overlay filters -->
<div class="mist-overlay"></div>

<!-- Core application wrapper -->
<div 
  class="relative z-10 min-h-screen flex flex-col transition-opacity duration-1000"
  [ngClass]="isLoaded ? 'opacity-100' : 'opacity-0'"
>
  <!-- Brand Header & Navigation -->
  <header class="w-full px-6 py-6 md:px-16 flex justify-between items-center z-40 bg-gradient-to-b from-cream-100/10 to-transparent dark:from-forest-950/10">
    <a routerLink="/" class="text-xl md:text-2xl font-serif font-semibold tracking-[0.25em] text-forest-900 dark:text-cream-100 transition-colors duration-1000">
      WHITE SEA
    </a>
    
    <nav class="hidden md:flex gap-10 items-center text-[10px] uppercase tracking-[0.3em] font-medium text-forest-800/80 dark:text-cream-200/80">
      <a routerLink="/" routerLinkActive="text-gold-500 font-bold" [routerLinkActiveOptions]="{exact: true}" class="hover:text-gold-500 transition-colors duration-300">The Retreat</a>
      <a (click)="scrollTo('about')" class="cursor-pointer hover:text-gold-500 transition-colors duration-300">Our Story</a>
      <a (click)="scrollTo('rooms')" class="cursor-pointer hover:text-gold-500 transition-colors duration-300">Rooms</a>
      <a (click)="scrollTo('attractions')" class="cursor-pointer hover:text-gold-500 transition-colors duration-300">Experiences</a>
      <a (click)="scrollTo('booking')" class="cursor-pointer hover:text-gold-500 transition-colors duration-300">Booking</a>
      <a routerLink="/concierge" routerLinkActive="text-gold-500 font-bold" class="hover:text-gold-500 transition-colors duration-300 flex items-center gap-1.5">
        <span>AI Concierge</span>
        <span class="w-1.5 h-1.5 rounded-full bg-gold-400 animate-pulse"></span>
      </a>
    </nav>

    <div>
      <button 
        (click)="scrollTo('booking')" 
        class="px-6 py-2.5 rounded-full bg-forest-950 text-cream-100 dark:bg-cream-100 dark:text-forest-950 hover:bg-gold-500 hover:text-cream-100 dark:hover:bg-gold-500 dark:hover:text-cream-100 text-[10px] uppercase tracking-widest font-semibold transition-all duration-500 shadow-md hover:scale-105 active:scale-95"
      >
        Book Stay
      </button>
    </div>
  </header>

  <!-- Page Route Content -->
  <main class="flex-grow flex flex-col relative z-20">
    <router-outlet></router-outlet>
  </main>

  <!-- Dynamic controls -->
  <app-theme-toggle></app-theme-toggle>
  <app-audio-toggle></app-audio-toggle>
</div>
